# One workflow for checks and deployment: the GitHub Pages deploy job
# `needs` the build job, so the site is only published from a commit that
# passed audit, format, type-check and build. The deployed artifact is the
# exact `dist/` this run verified.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Job name is referenced by branch-protection status checks — keep it.
    name: typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ships to the browser — block on any advisory.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Build tooling runs only in CI / on dev machines against our own
      # config, so block only on critical advisories (malware, RCE). Lower
      # severities are still listed in this step's log.
      - name: Audit all dependencies (critical only)
        run: npm audit --audit-level=critical

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy-only permissions; PR runs never get Pages write access.
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; queued runs wait instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
